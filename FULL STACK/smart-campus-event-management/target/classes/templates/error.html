<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Error - SmartCampus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="success-page">
    <div class="success-card">
        <div class="success-icon" style="background:rgba(239,68,68,0.1);">⚠️</div>
        <h2 th:text="${errorTitle} ?: 'Something Went Wrong'">Error</h2>
        <p th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again.'">Error message</p>
        <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1.5rem;">
            <a href="/events" class="btn btn-primary" style="justify-content:center;">Browse Events</a>
            <a href="/" class="btn btn-outline" style="justify-content:center;">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
