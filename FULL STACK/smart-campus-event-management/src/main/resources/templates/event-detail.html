<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${event.title} + ' - SmartCampus'">Event Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<nav class="navbar">
    <a href="/" class="navbar-brand"><div class="brand-icon"><i class="fas fa-calendar-star"></i></div>SmartCampus</a>
    <ul class="navbar-nav">
        <li><a href="/">Home</a></li>
        <li><a href="/events" class="active">Events</a></li>
        <li><a href="/my-registrations">My Registrations</a></li>
    </ul>
    <div class="navbar-actions">
        <!-- Unauthenticated View -->
        <span sec:authorize="!isAuthenticated()">
            <a href="/user-register" class="btn btn-outline btn-sm">Register</a>
            <a href="/login" class="btn btn-primary btn-sm">Sign In</a>
        </span>
        <!-- Authenticated View (Admin) -->
        <span sec:authorize="hasRole('ADMIN')">
            <a href="/admin/dashboard" class="btn btn-outline btn-sm">Admin Dashboard</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </span>
        <!-- Authenticated View (Student) -->
        <span sec:authorize="hasRole('STUDENT')">
            <a href="/student-dashboard" class="btn btn-outline btn-sm">Dashboard</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </span>
    </div>
</nav>

<div class="page-content" style="max-width:900px;margin:0 auto;">
    <a href="/events" style="display:inline-flex;align-items:center;gap:0.5rem;color:var(--text-muted);text-decoration:none;font-size:0.88rem;margin-bottom:1.5rem;">
        <i class="fas fa-arrow-left"></i> Back to Events
    </a>

    <div class="card" style="overflow:hidden;">
        <div th:if="${event.imageUrl != null}" style="height:300px;overflow:hidden;">
            <img th:src="${event.imageUrl}" alt="Event" style="width:100%;height:300px;object-fit:cover;"/>
        </div>
        <div th:if="${event.imageUrl == null}" style="height:200px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:4rem;">🎓</div>

        <div style="padding:2rem;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
                <div>
                    <span class="event-type-badge badge-workshop" th:text="${event.type}">Type</span>
                    <h1 style="font-size:1.8rem;font-weight:800;color:var(--text-dark);margin-top:0.5rem;" th:text="${event.title}">Title</h1>
                </div>
                <div style="text-align:right;">
                    <div class="event-price" style="font-size:1.5rem;" th:text="${event.ticketPrice != null and event.ticketPrice > 0} ? '₹' + ${event.ticketPrice} : 'FREE'">FREE</div>
                    <div class="seats-badge" th:text="${event.availableSeats} + ' seats available'">Seats</div>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem;padding:1.25rem;background:var(--bg);border-radius:var(--radius-sm);">
                <div class="event-meta-item"><i class="fas fa-calendar-alt" style="color:var(--primary);"></i><span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy, hh:mm a')}">Date</span></div>
                <div class="event-meta-item"><i class="fas fa-map-marker-alt" style="color:var(--primary);"></i><span th:text="${event.venue}">Venue</span></div>
                <div class="event-meta-item"><i class="fas fa-building" style="color:var(--primary);"></i><span th:text="${event.department}">Dept</span></div>
                <div class="event-meta-item"><i class="fas fa-users" style="color:var(--primary);"></i><span th:text="'Capacity: ' + ${event.capacity}">Capacity</span></div>
            </div>

            <h3 style="font-weight:700;margin-bottom:0.75rem;">About This Event</h3>
            <p style="color:var(--text-muted);line-height:1.8;margin-bottom:2rem;" th:text="${event.description}">Description</p>

            <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                <a th:href="@{/register/{id}(id=${event.id})}" class="btn btn-primary btn-lg"
                   th:if="${event.availableSeats > 0}">
                    <i class="fas fa-ticket-alt"></i> Register Now
                </a>
                <span class="btn btn-lg" style="background:#f3f4f6;color:var(--text-muted);cursor:not-allowed;"
                      th:if="${event.availableSeats == 0}">Fully Booked</span>
                <a th:href="@{/feedback/{id}(id=${event.id})}" class="btn btn-outline btn-lg">
                    <i class="fas fa-star"></i> Give Feedback
                </a>
                <a href="/events" class="btn btn-white btn-lg">Back to Events</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js?v=2}"></script>
</body>
</html>
